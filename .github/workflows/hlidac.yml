name: Hlídač úředních desek

on:
  schedule:
    # 05:20 UTC = 07:20 letního / 06:20 zimního času.
    # Nekulatá minuta schválně: v celou hodinu je fronta GitHubu nejdelší
    # a spuštění se často opozdí o desítky minut.
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Kolik dní zpět prohledat"
        required: false
        default: "7"
      dry_run:
        description: "1 = neukládat stav"
        required: false
        default: "0"
      nahled:
        description: "1 = náhled překladů, nic se neodešle (viz ?zdroj=nahled)"
        required: false
        default: "0"
      dashboards:
        description: "ID desek pro tenhle běh, prázdné = podle proměnné"
        required: false
        default: ""
      deska_dni:
        description: "Kolik dní zpět stáhnout soupis desky (jen pro stránku)"
        required: false
        default: "30"

permissions:
  contents: write
  issues: write   # nálezy se doručují jako issue, e-mail z nich pošle GitHub

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  hlidat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Spustit hlídač
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDESKY_API_KEY: ${{ secrets.EDESKY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDESKY_DASHBOARDS: ${{ github.event.inputs.dashboards || vars.EDESKY_DASHBOARDS || '260' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          NAHLED: ${{ github.event.inputs.nahled || '0' }}
          DESKA_STAHOVAT_DNI: ${{ github.event.inputs.deska_dni || '30' }}
        run: python hlidac.py

      - name: Uložit náhled
        if: github.event.inputs.nahled == '1'
        run: |
          # Náhled commituje výhradně svůj soubor. Ostrý stav (seen.json,
          # zpravy.json) se ho nesmí ani dotknout, jinak by zkušební běh
          # umlčel dokumenty, na které se ještě neupozornilo.
          if [[ -z "$(git status --porcelain state/nahled.json)" ]]; then
            echo "Náhled beze změny."
            exit 0
          fi

          git config user.name "hlidac-bot"
          git config user.email "actions@github.com"
          git add state/nahled.json
          git commit -m "náhled: $(date '+%Y-%m-%d %H:%M')"

          for pokus in 1 2 3; do
            git push && exit 0
            echo "Push odmítnut, srovnávám se vzdálenou větví (pokus $pokus)."
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "::error::Náhled se nepodařilo zapsat ani na třetí pokus."
          exit 1

      - name: Uložit stav
        if: github.event.inputs.dry_run != '1' && github.event.inputs.nahled != '1'
        run: |
          git config user.name "hlidac-bot"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain state/)" ]]; then
            git add state/
            git commit -m "stav: $(date +%Y-%m-%d)"
          elif [[ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]]; then
            # GitHub vypíná scheduled workflows po 60 dnech bez aktivity
            # v repozitáři. Stav se commituje jen když se něco najde, takže
            # v klidnějším období by se hlídač tiše vypnul — přesně před tím,
            # na co existuje. Po měsíci ticha proto commitneme naprázdno.
            git commit --allow-empty -m "heartbeat: $(date +%Y-%m-%d)"
          else
            echo "Beze změny."
            exit 0
          fi

          # Souběžný běh mohl mezi checkoutem a pushem zapsat vlastní stav.
          # Fronta (concurrency) to nezachytí celé: druhý běh stihne checkout
          # dřív, než první dokončí push, a pak si stěžuje na „fetch first".
          # Zkusíme se proto přerovnat a poslat znovu.
          #
          # Když rebase spadne na konfliktu ve state/, krok schválně spadne
          # taky a stav zůstane nezapsaný. Dokumenty se tím příště zpracují
          # znovu a nejhůř přijde zpráva dvakrát — což je pořád lepší než
          # tiše přepsat, co zapsal druhý běh, a jednu zprávu ztratit.
          for pokus in 1 2 3; do
            git push && exit 0
            echo "Push odmítnut, srovnávám se vzdálenou větví (pokus $pokus)."
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "::error::Stav se nepodařilo zapsat ani na třetí pokus."
          exit 1
